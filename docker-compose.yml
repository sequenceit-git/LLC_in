services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - internal
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}"
      # HTTP API router (works for direct IP or HTTP access)
      - "traefik.http.routers.llc-api-http.rule=${TRAEFIK_HOST_RULE:-Host(`${DOMAIN}`)} && PathPrefix(`/api`)"
      - "traefik.http.routers.llc-api-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.services.llc-api.loadbalancer.server.port=5000"
      # HTTPS API router (works when a domain with TLS is configured)
      - "traefik.http.routers.llc-api.rule=${TRAEFIK_HOST_RULE:-Host(`${DOMAIN}`)} && PathPrefix(`/api`)"
      - "traefik.http.routers.llc-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.llc-api.tls=true"
      - "traefik.http.routers.llc-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    networks:
      - internal
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}"
      # HTTP Frontend router (works for direct IP or HTTP access)
      - "traefik.http.routers.llc-web-http.rule=${TRAEFIK_HOST_RULE:-Host(`${DOMAIN}`)}"
      - "traefik.http.routers.llc-web-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.services.llc-web.loadbalancer.server.port=80"
      # HTTPS Frontend router (works when a domain with TLS is configured)
      - "traefik.http.routers.llc-web.rule=${TRAEFIK_HOST_RULE:-Host(`${DOMAIN}`)}"
      - "traefik.http.routers.llc-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.llc-web.tls=true"
      - "traefik.http.routers.llc-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"

networks:
  internal:
    driver: bridge
  traefik_network:
    name: ${TRAEFIK_NETWORK:-traefik_default}
    external: true
