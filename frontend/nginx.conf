server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16M;

  include /etc/nginx/mime.types;
  default_type text/html;

  # Proxy API to the backend service (docker-compose service name: api)
  location ^~ /api {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin pages must not be indexed. Authentication remains enforced by the app/API.
  location ^~ /admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }

  # Static assets with long-term caching
  location ~* \.(js|css|woff2?|png|jpe?g|svg|ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback:
  # 1. Test exact file ($uri)
  # 2. Test directory index ($uri/ -> index.html)
  # 3. Test pre-rendered SEO route entrypoint (/seo$uri.html)
  # 4. Fallback to /index.html
  location / {
    try_files $uri $uri/ /seo$uri.html /index.html;
  }
}
